<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>tsolluos</title>

    <!--
        Ancient Gate styles live in their own file so this HTML remains
        responsible for structure rather than appearance.
    -->
    <link rel="stylesheet" href="css/style.css?v=alien-journey-1">
</head>

<body>

    <!--
        Ancient Gate begins with an intentionally empty stage.

        We will add visual elements one small, tested step at a time.
        The first goal is simply to prove that this page loads correctly.
    -->
    <main class="ancient-gate">

    <!--
        The fog is its own visual layer.

        Keeping it separate means we can later place other elements,
        such as the eyes and gate, above or below it without changing
        what those elements are responsible for.
    -->
    <div class="fog"></div>

    <!--
        The first Gate is deliberately only a distant silhouette.

        It appears after the fog but before the body layers, placing
        the visitor's eyes, hands, and feet naturally in front of it.
    -->
    <div class="gate-silhouette" aria-hidden="true">
        <!--
            The Gate contains an interior layer behind two closed doors.

            Their basic visual relationship is established before the
            opening grows or the world beyond receives further detail.
        -->

        <!--
            The interior is a separate layer behind both doors.

            It remains hidden until the doors begin to part, allowing
            the opening to reveal light without defining what lies beyond.
        -->
        <div class="gate-interior"></div>

        <!--
            Each door owns both a front and reverse inscription.

            The front halves form tsolluos across the closed-door seam.
            After the outward swing, the reverse faces reveal lost soul.
        -->
        <div class="gate-door gate-door-left">
            <!--
                The left door carries one half of the heart-shaped ornament.

                Together the two door paths form one heart while closed
                and separate naturally when the Gate opens.
            -->
            <svg
                class="gate-heart gate-heart-left"
                viewBox="0 0 70 110"
                aria-hidden="true"
            >
                <path
                    d="
                        M 70 103
                        C 60 93, 8 61, 8 31
                        C 8 10, 34 2, 50 16
                        C 60 23, 66 32, 70 40
                    "
                />
            </svg>
            <span class="door-inscription gate-inscription gate-inscription-left">tsol</span>
            <span class="door-inscription gate-reverse-inscription gate-reverse-inscription-left">lost</span>
        </div>

        <div class="gate-door gate-door-right">
            <!--
                The right path mirrors the left half around the door seam.
            -->
            <svg
                class="gate-heart gate-heart-right"
                viewBox="0 0 70 110"
                aria-hidden="true"
            >
                <path
                    d="
                        M 0 40
                        C 4 32, 10 23, 20 16
                        C 36 2, 62 10, 62 31
                        C 62 61, 10 93, 0 103
                    "
                />
            </svg>
            <span class="door-inscription gate-inscription gate-inscription-right">luos</span>
            <span class="door-inscription gate-reverse-inscription gate-reverse-inscription-right">soul</span>
        </div>
    </div>

<!--
    The Alien's anatomical eyes emerge first from the darkness.

    After one blink, Earth appears inside both pupils as a silent glimpse
    of the destination carried within the traveler's vision.
-->
<div class="eyes" aria-hidden="true">
    <div class="alien-eyes-stage">
        <img
            class="alien-eyes-base"
            src="images/ancient-gate-alien-eyes-base.png"
            alt=""
        >

        <span class="alien-pupil alien-pupil-left"></span>
        <span class="alien-pupil alien-pupil-right"></span>

        <img
            class="alien-eyes-closed"
            src="images/ancient-gate-alien-eyes-closed.png"
            alt=""
        >
    </div>
</div>

<!--
    The visitor first discovers the feet of the complete Alien traveler.

    The image is cropped by its container so only the feet appear during
    this stage of the discovery sequence.
-->
<div class="feet" aria-hidden="true">
    <img
        class="alien-feet-image"
        src="images/ancient-gate-alien.png"
        alt=""
    >
</div>

<!--
    The visitor raises its own hands after discovering its feet.

    This first-person image belongs to the same Alien traveler that will
    later appear completely and pass through the Ancient Gate.
-->
<div class="hands" aria-hidden="true">
    <img
        class="alien-hand-image alien-hand-image-left"
        src="images/ancient-gate-alien-hand-left.png"
        alt=""
    >

    <img
        class="alien-hand-image alien-hand-image-right"
        src="images/ancient-gate-alien-hand-right.png"
    alt=""
    >
</div>

<!--
    The complete Alien acknowledges the visitor before turning toward
    the Ancient Gate.

    Matching front and rear images occupy opposite faces of one rotating
    stage, creating a continuous turn without changing character scale.
-->
<div class="alien-body" aria-hidden="true">
    <div class="alien-turner">
        <img
            class="alien-body-image alien-body-front"
            src="images/ancient-gate-alien-peace-mudra.png"
            alt=""
        >

        <img
            class="alien-body-image alien-body-back"
            src="images/ancient-gate-alien-departure.png"
            alt=""
        >
    </div>
</div>

</main>

</body>
</html>
