<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>tsolluos</title>

    <!--
        Ancient Gate styles live in their own file so this HTML remains
        responsible for structure rather than appearance.
    -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!--
        Ancient Gate begins with an intentionally empty stage.

        We will add visual elements one small, tested step at a time.
        The first goal is simply to prove that this page loads correctly.
    -->
    <main class="ancient-gate">

    <!--
        The fog is its own visual layer.

        Keeping it separate means we can later place other elements,
        such as the eyes and gate, above or below it without changing
        what those elements are responsible for.
    -->
    <div class="fog"></div>

    <!--
        The first Gate is deliberately only a distant silhouette.

        It appears after the fog but before the body layers, placing
        the visitor's eyes, hands, and feet naturally in front of it.
    -->
    <div class="gate-silhouette" aria-hidden="true">
        <!--
            The Gate contains an interior layer behind two closed doors.

            Their basic visual relationship is established before the
            opening grows or the world beyond receives further detail.
        -->

        <!--
            The interior is a separate layer behind both doors.

            It remains hidden until the doors begin to part, allowing
            the opening to reveal light without defining what lies beyond.
        -->
        <div class="gate-interior"></div>

        <!--
            Each door owns both a front and reverse inscription.

            The front halves form tsolluos across the closed-door seam.
            After the outward swing, the reverse faces reveal lost soul.
        -->
        <div class="gate-door gate-door-left">
            <span class="door-inscription gate-inscription gate-inscription-left">tsol</span>
            <span class="door-inscription gate-reverse-inscription gate-reverse-inscription-left">lost</span>
        </div>

        <div class="gate-door gate-door-right">
            <span class="door-inscription gate-inscription gate-inscription-right">luos</span>
            <span class="door-inscription gate-reverse-inscription gate-reverse-inscription-right">soul</span>
        </div>
    </div>

<!--
    The eyes are drawn with SVG because they are visual shapes rather
    than page structure.

    This first version is intentionally static. Before teaching the
    eyes to blink or look around, we prove that their basic shapes,
    position, and scale work.
-->
<svg class="eyes" viewBox="0 0 300 120" aria-hidden="true">

    <!-- Left eye -->
    <ellipse
        cx="90"
        cy="60"
        rx="55"
        ry="30"
        class="eye"
    />

    <!-- Left pupil -->
    <circle
        cx="90"
        cy="60"
        r="12"
        class="pupil"
    />

    <!-- Right eye -->
    <ellipse
        cx="210"
        cy="60"
        rx="55"
        ry="30"
        class="eye"
    />

    <!-- Right pupil -->
    <circle
        cx="210"
        cy="60"
        r="12"
        class="pupil"
    />

</svg>

<!--
    The feet occupy a separate visual layer because they are discovered
    independently during the Ancient Gate opening sequence.

    Each foot groups a curved sole with five individually sized toe shapes.
    The result is recognizable rather than anatomically realistic.
-->
<svg
    class="feet"
    viewBox="0 0 300 140"
    aria-hidden="true"
>
    <!--
        The group keeps the sole and toes together as one foot.
        Rotating the group therefore rotates every included shape.
    -->
    <g class="foot foot-left">
        <!--
            The sole widens beneath the toes and narrows toward the heel.
            Curved path segments create an organic outline without realism.
        -->
        <path
            d="
                M 76 130
                C 68 119, 66 101, 68 82
                C 70 62, 73 45, 80 32
                C 87 22, 101 21, 111 29
                C 121 38, 124 54, 122 71
                C 120 89, 116 105, 111 120
                C 106 134, 86 140, 76 130
                Z
            "
        />

        <!-- Five individually positioned circles suggest separated toes. -->
        <circle cx="77" cy="33" r="4" />
        <circle cx="83" cy="24" r="5" />
        <circle cx="94" cy="21" r="5" />
        <circle cx="106" cy="22" r="6" />
        <circle cx="118" cy="31" r="8" />
    </g>

    <!--
        The right foot mirrors the left foot.
        Its largest inner toe faces toward the center of the body.
    -->
    <g class="foot foot-right">
        <!--
            This path mirrors the refined left sole around the SVG center.
            Its forefoot widens beneath the toes and narrows at the heel.
        -->
        <path
            d="
                M 224 130
                C 232 119, 234 101, 232 82
                C 230 62, 227 45, 220 32
                C 213 22, 199 21, 189 29
                C 179 38, 176 54, 178 71
                C 180 89, 184 105, 189 120
                C 194 134, 214 140, 224 130
                Z
            "
        />

        <!-- Five individually positioned circles suggest separated toes. -->
        <circle cx="182" cy="32" r="8" />
        <circle cx="194" cy="22" r="6" />
        <circle cx="206" cy="21" r="5" />
        <circle cx="217" cy="24" r="5" />
        <circle cx="223" cy="33" r="4" />
    </g>
</svg>

<!--
    The hands occupy a separate visual layer so their discovery can occur
    independently after the eyes have found the feet.

    Each hand groups a palm, four fingers, and an inward-facing thumb.
    The shapes remain deliberately simple while establishing viewpoint.
-->
<svg
    class="hands"
    viewBox="0 0 500 180"
    aria-hidden="true"
>
    <!--
        The group keeps the palm, four fingers, and thumb together.
        The existing hand rotation is applied to the complete group.
    -->
    <g class="hand hand-left">
        <!-- Palm -->
        <ellipse
            cx="100"
            cy="90"
            rx="38"
            ry="58"
        />

        <!-- Four rounded rectangles suggest raised fingers. -->
        <rect x="66" y="18" width="15" height="40" rx="7" />
        <rect x="83" y="7" width="15" height="48" rx="7" />
        <rect x="100" y="2" width="15" height="52" rx="7" />
        <rect x="117" y="12" width="15" height="44" rx="7" />

        <!-- The thumb faces inward toward the center of the body. -->
        <ellipse
            cx="140"
            cy="88"
            rx="11"
            ry="25"
            transform="rotate(-55 140 88)"
        />
    </g>

    <!--
        The right hand mirrors the left hand.
        Its thumb faces inward toward the center of the body.
    -->
    <g class="hand hand-right">
        <!-- Palm -->
        <ellipse
            cx="400"
            cy="90"
            rx="38"
            ry="58"
        />

        <!-- Four rounded rectangles suggest raised fingers. -->
        <rect x="368" y="12" width="15" height="44" rx="7" />
        <rect x="385" y="2" width="15" height="52" rx="7" />
        <rect x="402" y="7" width="15" height="48" rx="7" />
        <rect x="419" y="18" width="15" height="40" rx="7" />

        <!-- The thumb faces inward toward the center of the body. -->
        <ellipse
            cx="360"
            cy="88"
            rx="11"
            ry="25"
            transform="rotate(55 360 88)"
        />
    </g>

</svg>

</main>

</body>
</html>
