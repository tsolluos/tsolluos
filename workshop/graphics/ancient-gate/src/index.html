<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>tsolluos</title>

    <!--
        Ancient Gate styles live in their own file so this HTML remains
        responsible for structure rather than appearance.
    -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!--
        Ancient Gate begins with an intentionally empty stage.

        We will add visual elements one small, tested step at a time.
        The first goal is simply to prove that this page loads correctly.
    -->
    <main class="ancient-gate">

    <!--
        The fog is its own visual layer.

        Keeping it separate means we can later place other elements,
        such as the eyes and gate, above or below it without changing
        what those elements are responsible for.
    -->
    <div class="fog"></div>

<!--
    The eyes are drawn with SVG because they are visual shapes rather
    than page structure.

    This first version is intentionally static. Before teaching the
    eyes to blink or look around, we prove that their basic shapes,
    position, and scale work.
-->
<svg class="eyes" viewBox="0 0 300 120" aria-hidden="true">

    <!-- Left eye -->
    <ellipse
        cx="90"
        cy="60"
        rx="55"
        ry="30"
        class="eye"
    />

    <!-- Left pupil -->
    <circle
        cx="90"
        cy="60"
        r="12"
        class="pupil"
    />

    <!-- Right eye -->
    <ellipse
        cx="210"
        cy="60"
        rx="55"
        ry="30"
        class="eye"
    />

    <!-- Right pupil -->
    <circle
        cx="210"
        cy="60"
        r="12"
        class="pupil"
    />

</svg>

<!--
    The feet occupy a separate visual layer because they are discovered
    independently during the Ancient Gate opening sequence.

    Each foot groups a simple sole with five overlapping toe shapes.
    The result is recognizable rather than anatomically realistic.
-->
<svg
    class="feet"
    viewBox="0 0 300 140"
    aria-hidden="true"
>
    <!--
        The group keeps the sole and toes together as one foot.
        Rotating the group therefore rotates every included shape.
    -->
    <g class="foot foot-left">
        <ellipse
            cx="95"
            cy="75"
            rx="32"
            ry="58"
        />

        <!-- Five overlapping circles suggest toes without realism. -->
        <circle cx="73" cy="22" r="6" />
        <circle cx="83" cy="17" r="7" />
        <circle cx="94" cy="14" r="8" />
        <circle cx="106" cy="15" r="9" />
        <circle cx="118" cy="20" r="10" />
    </g>

    <!--
        The right foot mirrors the left foot.
        Its largest inner toe faces toward the center of the body.
    -->
    <g class="foot foot-right">
        <ellipse
            cx="205"
            cy="75"
            rx="32"
            ry="58"
        />

        <!-- Five overlapping circles suggest toes without realism. -->
        <circle cx="182" cy="20" r="10" />
        <circle cx="194" cy="15" r="9" />
        <circle cx="206" cy="14" r="8" />
        <circle cx="217" cy="17" r="7" />
        <circle cx="227" cy="22" r="6" />
    </g>
</svg>

<!--
    The hands occupy a separate visual layer so their discovery can occur
    independently after the eyes have found the feet.

    Each hand groups a palm, four fingers, and an inward-facing thumb.
    The shapes remain deliberately simple while establishing viewpoint.
-->
<svg
    class="hands"
    viewBox="0 0 500 180"
    aria-hidden="true"
>
    <!--
        The group keeps the palm, four fingers, and thumb together.
        The existing hand rotation is applied to the complete group.
    -->
    <g class="hand hand-left">
        <!-- Palm -->
        <ellipse
            cx="100"
            cy="90"
            rx="38"
            ry="58"
        />

        <!-- Four rounded rectangles suggest raised fingers. -->
        <rect x="66" y="18" width="15" height="40" rx="7" />
        <rect x="83" y="7" width="15" height="48" rx="7" />
        <rect x="100" y="2" width="15" height="52" rx="7" />
        <rect x="117" y="12" width="15" height="44" rx="7" />

        <!-- The thumb faces inward toward the center of the body. -->
        <ellipse
            cx="140"
            cy="88"
            rx="11"
            ry="25"
            transform="rotate(-55 140 88)"
        />
    </g>

    <!--
        The right hand mirrors the left hand.
        Its thumb faces inward toward the center of the body.
    -->
    <g class="hand hand-right">
        <!-- Palm -->
        <ellipse
            cx="400"
            cy="90"
            rx="38"
            ry="58"
        />

        <!-- Four rounded rectangles suggest raised fingers. -->
        <rect x="368" y="12" width="15" height="44" rx="7" />
        <rect x="385" y="2" width="15" height="52" rx="7" />
        <rect x="402" y="7" width="15" height="48" rx="7" />
        <rect x="419" y="18" width="15" height="40" rx="7" />

        <!-- The thumb faces inward toward the center of the body. -->
        <ellipse
            cx="360"
            cy="88"
            rx="11"
            ry="25"
            transform="rotate(55 360 88)"
        />
    </g>

</svg>

</main>

</body>
</html>
