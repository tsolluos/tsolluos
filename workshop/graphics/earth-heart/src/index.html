<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Earth Heart</title>

    <!--
        Main stylesheet.

        CSS controls how things look.
        HTML describes what things are.
    -->
    <link rel="stylesheet" href="css/style.css?v=earth-heart-refinement-1">
</head>

<body>

<!--
    SVG is used because it draws shapes mathematically.

    Unlike bitmap images, SVG graphics remain perfectly sharp
    at any size.
-->
<svg
    width="600"
    height="600"
    viewBox="0 0 600 600">

<!--
    The clipping circle hides the square corners of the Earth image.
-->
<defs>
    <clipPath id="earth-clip">
        <circle
            cx="300"
            cy="300"
            r="140"
        />
    </clipPath>
</defs>

<!--
    This invisible elliptical path defines the exact route followed by the H.
-->
<path
    id="orbit-route"
    class="orbit-path"
    d="
        M 300 90
        A 145 210 0 0 1 445 300
        A 145 210 0 0 1 300 510
        A 135 210 0 0 1 155 300
        A 135 210 0 0 1 300 90
    "
/>

<!--
    NASA's Blue Marble image fills the existing Earth dimensions.

    The clip path keeps the square JPEG inside a circular boundary.

    Source: NASA PIA18033, Suomi NPP / VIIRS.
    https://images.nasa.gov/details/PIA18033
-->
<image
    class="earth-image"
    href="images/earth-blue-marble.jpg"
    x="160"
    y="160"
    width="280"
    height="280"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#earth-clip)"
/>

    <!--
        Four individually positioned letters span the Earth.

        Their optical spacing leaves room for the orbiting H to complete
        HEART on the left and EARTH on the right.
    -->
    <text
        x="300"
        y="315"
        class="earth-text">

        <tspan x="212">E</tspan>
        <tspan x="275">A</tspan>
        <tspan x="345">R</tspan>
        <tspan x="399">T</tspan>

    </text>

<!--
    The carrier follows the shared elliptical route.

    rotate="0" keeps the H upright throughout its journey.
-->
<g class="orbit-carrier">
    <animateMotion
        dur="20s"
        repeatCount="indefinite"
        rotate="0"
        calcMode="linear"
        keyPoints="0; 0.25; 0.25; 0.5; 0.75; 0.75; 1"
        keyTimes="0; 0.20; 0.30; 0.50; 0.70; 0.80; 1">
        <mpath href="#orbit-route" />
    </animateMotion>

    <text
        x="0"
        y="15"
        class="orbit-letter">

        <animate
            attributeName="y"
            dur="20s"
            repeatCount="indefinite"
            calcMode="linear"
            values="15; 13; 13; 15; 17; 17; 15"
            keyTimes="0; 0.20; 0.30; 0.50; 0.70; 0.80; 1"
        />

        H

    </text>
</g>

</svg>

</body>
</html>
