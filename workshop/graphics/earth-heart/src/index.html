<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Earth Heart</title>

    <!--
        Main stylesheet.

        CSS controls how things look.
        HTML describes what things are.
    -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!--
    SVG is used because it draws shapes mathematically.

    Unlike bitmap images, SVG graphics remain perfectly sharp
    at any size.
-->
<svg
    width="600"
    height="600"
    viewBox="0 0 600 600">

<!--
    One shared path serves as both the visible orbit guide
    and the exact route followed by the H.
-->
<path
    id="orbit-route"
    class="orbit-path"
    d="
        M 300 90
        A 100 210 0 0 1 400 300
        A 100 210 0 0 1 300 510
        A 100 210 0 0 1 200 300
        A 100 210 0 0 1 300 90
    "
/>

    <!--
        The Earth.

        cx = center x
        cy = center y
        r  = radius
    -->
    <circle
        cx="300"
        cy="300"
        r="140"
        class="earth"/>

    <!--
        The letters inside the Earth.

        The H will be added later.
    -->
    <text
        x="300"
        y="315"
        class="earth-text">

        EART

    </text>

<!--
    The carrier follows the shared elliptical route.

    rotate="0" keeps the H upright throughout its journey.
-->
<g class="orbit-carrier">
    <animateMotion
        dur="20s"
        repeatCount="indefinite"
        rotate="0"
        calcMode="linear"
        keyPoints="0; 0.25; 0.25; 0.5; 0.75; 0.75; 1"
        keyTimes="0; 0.20; 0.30; 0.50; 0.70; 0.80; 1">
        <mpath href="#orbit-route" />
    </animateMotion>

    <text
        x="0"
        y="15"
        class="orbit-letter">

        H

    </text>
</g>

</svg>

</body>
</html>
