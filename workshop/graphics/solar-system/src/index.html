<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solar System</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="solar-system">
        <!--
            The Sun establishes the center of our illustrative system.

            Planet sizes and distances will be simplified so the complete
            Solar System remains visible inside one browser window.
        -->
        <div class="sun" aria-label="Sun"></div>

        <!--
            Mercury's orbit is centered on the Sun.

            The planet belongs inside its orbit so the complete orbit can
            later rotate and carry Mercury around the Sun.
        -->
        <div class="orbit mercury-orbit">
            <div class="planet mercury" aria-label="Mercury"></div>
        </div>

        <!--
            Venus occupies the second orbit from the Sun.

            Starting it at the top prevents all the planets from appearing
            in one artificial straight line.
        -->
        <div class="orbit venus-orbit">
            <div class="planet venus" aria-label="Venus"></div>
        </div>

        <!--
            Earth occupies the third orbit from the Sun.

            Its blue and green surface makes our destination recognizable
            without attempting photographic detail at this tiny scale.
        -->
        <div class="orbit earth-orbit">
            <div class="planet earth" aria-label="Earth"></div>
        </div>

        <!--
            Mars occupies the fourth orbit from the Sun.

            Its rust-red color reflects the iron-rich material that gives
            the real planet its familiar appearance.
        -->
        <div class="orbit mars-orbit">
            <div class="planet mars" aria-label="Mars"></div>
        </div>

        <!--
            Jupiter begins the outer group of giant planets.

            Its larger visible size distinguishes it from the four small,
            rocky worlds closer to the Sun.
        -->
        <div class="orbit jupiter-orbit">
            <div class="planet jupiter" aria-label="Jupiter"></div>
        </div>

        <!--
            Saturn occupies the sixth orbit.

            A separate ring shape surrounds the planet, preserving Saturn's
            most recognizable feature at this compressed visual scale.
        -->
        <div class="orbit saturn-orbit">
            <div class="planet saturn" aria-label="Saturn"></div>
        </div>

        <!--
            Uranus occupies the seventh orbit.

            Its pale blue-green color and strongly tilted ring suggest
            the planet's unusual orientation.
        -->
        <div class="orbit uranus-orbit">
            <div class="planet uranus" aria-label="Uranus"></div>
        </div>

        <!--
            Neptune occupies the eighth and outermost planetary orbit.

            Its deeper blue distinguishes it from the paler cyan Uranus.
        -->
        <div class="orbit neptune-orbit">
            <div class="planet neptune" aria-label="Neptune"></div>
        </div>
    </main>

</body>
</html>
